<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Inventory Management</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        .auth-page {
            align-items: center;
            min-height: 100vh;
        }
        .auth-card {
            max-width: 440px;
            padding: 28px 32px;
            max-height: 90vh;
            overflow-y: auto;
            margin: 20px;
        }
        .auth-card::-webkit-scrollbar {
            width: 4px;
        }
        .auth-card::-webkit-scrollbar-track {
            background: transparent;
        }
        .auth-card::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .auth-card .logo {
            margin-bottom: 20px;
        }
        .auth-card .logo h1 {
            font-size: 22px;
        }
        .auth-card .logo p {
            font-size: 13px;
        }
        .form-group {
            margin-bottom: 12px !important;
        }
        .form-group label {
            font-size: 13px !important;
            font-weight: 600 !important;
            margin-bottom: 4px !important;
        }
        .form-group input {
            padding: 9px 14px !important;
            font-size: 14px !important;
            border-radius: 8px !important;
        }
        .password-wrapper input {
            padding-right: 44px !important;
        }
        .toggle-password {
            right: 10px !important;
        }
        .toggle-password svg {
            width: 18px;
            height: 18px;
        }
        .password-hints {
            margin-top: 4px !important;
        }
        .password-hints .hint {
            font-size: 11px !important;
            line-height: 1.4;
        }
        .error-message {
            font-size: 11px !important;
            margin-top: 3px !important;
        }
        .btn-primary {
            padding: 11px !important;
            font-size: 15px !important;
            margin-top: 4px !important;
        }
        .auth-link {
            margin-top: 14px !important;
            font-size: 13px !important;
        }
        .auth-link a {
            font-weight: 600;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="logo">
            <h1>Create Account</h1>
            <p>Start managing your inventory</p>
        </div>
        
        <form id="registerForm" novalidate>
            <!-- Nama -->
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="John Doe" autocomplete="off" />
                <div class="error-message" id="nameError"></div>
            </div>
            
            <!-- Email -->
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@gmail.com" autocomplete="off" />
                <div class="error-message" id="emailError"></div>
            </div>
            
            <!-- Password -->
            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Min 8 characters" />
                    <button type="button" class="toggle-password" onclick="togglePassword('password')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <div class="password-hints">
                    <span id="hintLength" class="hint">• Minimal 8 karakter</span>
                    <span id="hintUpper" class="hint">• Diawali huruf besar</span>
                    <span id="hintNumber" class="hint">• Mengandung angka</span>
                </div>
                <div class="error-message" id="passwordError"></div>
            </div>
            
            <!-- Confirm Password -->
            <div class="form-group">
                <label>Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm password" />
                    <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword')">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
                <div class="error-message" id="confirmError"></div>
            </div>
            
            <button type="submit" class="btn-primary" id="registerBtn">Create Account</button>
        </form>
        
        <div class="auth-link">
            Already have account? <a href="login.html">Sign In</a>
        </div>
    </div>
    
    <script>
        // ============================================
        // TOGGLE PASSWORD
        // ============================================
        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }
        
        // ============================================
        // REAL-TIME VALIDATION (INSTANT)
        // ============================================
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        
        const nameError = document.getElementById('nameError');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const confirmError = document.getElementById('confirmError');
        
        const hintLength = document.getElementById('hintLength');
        const hintUpper = document.getElementById('hintUpper');
        const hintNumber = document.getElementById('hintNumber');
        
        // VALIDASI NAMA - INSTANT
        nameInput.addEventListener('input', function() {
            const value = this.value.trim();
            if (value.length > 0 && value.length < 2) {
                nameError.textContent = '❌ Nama minimal 2 karakter';
                nameError.style.color = '#ef4444';
                nameError.style.display = 'block';
            } else if (value.length >= 2) {
                nameError.textContent = '✅ Nama valid';
                nameError.style.color = '#10b981';
                nameError.style.display = 'block';
            } else {
                nameError.style.display = 'none';
            }
        });
        
        // VALIDASI EMAIL - INSTANT
        emailInput.addEventListener('input', function() {
            const value = this.value.trim();
            if (value.length > 0 && !value.endsWith('@gmail.com')) {
                emailError.textContent = '❌ Email harus menggunakan @gmail.com';
                emailError.style.color = '#ef4444';
                emailError.style.display = 'block';
            } else if (value.length > 0 && value.endsWith('@gmail.com')) {
                emailError.textContent = '✅ Email valid';
                emailError.style.color = '#10b981';
                emailError.style.display = 'block';
            } else {
                emailError.style.display = 'none';
            }
        });
        
        // VALIDASI PASSWORD - INSTANT
        passwordInput.addEventListener('input', function() {
            const value = this.value;
            let allValid = true;
            
            if (value.length >= 8) {
                hintLength.style.color = '#10b981';
                hintLength.textContent = '✅ Minimal 8 karakter';
            } else {
                hintLength.style.color = '#ef4444';
                hintLength.textContent = '❌ Minimal 8 karakter';
                allValid = false;
            }
            
            if (/^[A-Z]/.test(value)) {
                hintUpper.style.color = '#10b981';
                hintUpper.textContent = '✅ Diawali huruf besar';
            } else {
                hintUpper.style.color = '#ef4444';
                hintUpper.textContent = '❌ Diawali huruf besar';
                allValid = false;
            }
            
            if (/[0-9]/.test(value)) {
                hintNumber.style.color = '#10b981';
                hintNumber.textContent = '✅ Mengandung angka';
            } else {
                hintNumber.style.color = '#ef4444';
                hintNumber.textContent = '❌ Mengandung angka';
                allValid = false;
            }
            
            if (value.length > 0 && allValid) {
                passwordError.textContent = '✅ Password kuat!';
                passwordError.style.color = '#10b981';
                passwordError.style.display = 'block';
            } else if (value.length > 0) {
                passwordError.textContent = '❌ Password belum memenuhi syarat';
                passwordError.style.color = '#ef4444';
                passwordError.style.display = 'block';
            } else {
                passwordError.style.display = 'none';
            }
        });
        
        // VALIDASI CONFIRM - INSTANT
        confirmInput.addEventListener('input', function() {
            const password = passwordInput.value;
            const confirm = this.value;
            
            if (confirm.length > 0 && password !== confirm) {
                confirmError.textContent = '❌ Password tidak sama!';
                confirmError.style.color = '#ef4444';
                confirmError.style.display = 'block';
            } else if (confirm.length > 0 && password === confirm) {
                confirmError.textContent = '✅ Password cocok!';
                confirmError.style.color = '#10b981';
                confirmError.style.display = 'block';
            } else {
                confirmError.style.display = 'none';
            }
        });
        
        // ============================================
        // CEK EMAIL & NAMA KE DATABASE (SAAT TYPING)
        // ============================================
        let emailTimeout, nameTimeout;
        
        emailInput.addEventListener('input', function() {
            clearTimeout(emailTimeout);
            const email = this.value.trim();
            
            if (email.length > 5 && email.endsWith('@gmail.com')) {
                emailTimeout = setTimeout(async () => {
                    try {
                        const response = await fetch('http://localhost:3000/api/auth/check-email', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ email })
                        });
                        const data = await response.json();
                        
                        if (data.exists) {
                            emailError.textContent = '❌ Email sudah terdaftar!';
                            emailError.style.color = '#ef4444';
                            emailError.style.display = 'block';
                        }
                    } catch (error) {
                        console.log('Cek email error:', error);
                    }
                }, 300);
            }
        });
        
        nameInput.addEventListener('input', function() {
            clearTimeout(nameTimeout);
            const name = this.value.trim();
            
            if (name.length >= 2) {
                nameTimeout = setTimeout(async () => {
                    try {
                        const response = await fetch('http://localhost:3000/api/auth/check-name', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name })
                        });
                        const data = await response.json();
                        
                        if (data.exists) {
                            nameError.textContent = '❌ Nama sudah digunakan!';
                            nameError.style.color = '#ef4444';
                            nameError.style.display = 'block';
                        }
                    } catch (error) {
                        console.log('Cek nama error:', error);
                    }
                }, 300);
            }
        });
    </script>
    
    <script src="js/auth.js"></script>
</body>
</html>
