<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Management</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="index.html" class="navbar-brand">
                Inventory Management
                <span>v1.0</span>
            </a>
            <div class="navbar-menu">
                <div class="user-info">
                    <div class="avatar" id="userAvatar">U</div>
                    <span class="user-name" id="userName">User</span>
                </div>
                <button class="btn-logout" onclick="logout()">Sign Out</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container">
            <!-- Alert -->
            <div id="alertMessage" class="alert"></div>

            <!-- Stats -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">Total Items</div>
                    <div class="stat-value blue" id="totalItems">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Stock</div>
                    <div class="stat-value" id="totalStock">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Total Value</div>
                    <div class="stat-value green" id="totalValue">Rp 0</div>
                </div>
            </div>

            <!-- Search & Actions -->
            <div class="actions-bar">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search products..." />
                    <button onclick="searchItems()">Search</button>
                </div>
                <button class="btn-secondary" onclick="clearSearch()">Clear</button>
            </div>

            <!-- Form -->
            <div class="form-section">
                <h2 id="formTitle">Add New Item</h2>
                <div class="form-group-row">
                    <input type="text" id="nameInput" placeholder="Product name..." />
                    <input type="number" id="stockInput" placeholder="Stock quantity..." />
                    <input type="number" id="priceInput" placeholder="Price..." />
                    <input type="hidden" id="editId" />
                    <button class="btn-primary" id="saveBtn">Save</button>
                    <button class="btn-secondary" id="cancelBtn" style="display:none;">Cancel</button>
                </div>
            </div>

            <!-- Table -->
            <div class="table-wrapper">
                <div id="loading" class="loading">Loading data...</div>
                <table id="dataTable" style="display:none;">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Product Name</th>
                            <th>Stock</th>
                            <th>Price</th>
                            <th>Subtotal</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="dataBody"></tbody>
                    <tfoot id="dataFoot"></tfoot>
                </table>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
